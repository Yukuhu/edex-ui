name: Build packaged binaries

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
      - name: Install build deps
        run: npm install
      - name: Run prebuild script
        run: npm run prebuild-linux
      - name: Build for x64
        # Electron 42 dropped 32-bit Linux (--ia32) and armv7l support;
        # ARM64 is built in a separate job below.
        run: ./node_modules/.bin/electron-builder build -l --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: Linux-AppImage-x64
          path: dist/*.AppImage
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js 22 (for the prebuild script)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
      - name: Run prebuild outside of QEMU emulator
        run: |
          npm install
          rsync -a --info=progress2 src/ prebuild-src --exclude node_modules
          node prebuild-minify.js
          rm -rf node_modules
      - name: Build for arm64
        # `uses: docker://...` doesn't tell Docker which platform to
        # pull, so it defaults to linux/amd64 and fails on an
        # arm64v8/ image. An explicit `docker run --platform linux/arm64`
        # uses the QEMU emulation registered above.
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work -w /work \
            -e GH_TOKEN \
            arm64v8/node:22-bookworm \
            bash -c "npm install && ./node_modules/.bin/electron-builder build -l --arm64"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: Linux-AppImage-arm64
          path: dist/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
      - name: npm install
        run: npm install
      - name: npm build
        run: npm run build-windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
      - name: npm install
        run: npm install
      - name: npm build
        run: npm run build-darwin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Split per-arch so each artifact downloads as a single .dmg
      # rather than a zip containing both — matches the per-arch
      # naming used for the Linux AppImages above.
      - uses: actions/upload-artifact@v7
        with:
          name: MacOS-dmg-x64
          path: dist/nDEX-UI-macOS-x64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: MacOS-dmg-arm64
          path: dist/nDEX-UI-macOS-arm64.dmg
          if-no-files-found: error
