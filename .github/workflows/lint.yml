name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match Electron 42's bundled Node (22.x), same as tests.yml.
          node-version: '22'
          cache: 'npm'

      # ESLint + globals are root devDependencies; `npm ci` is enough.
      # The src/ workspace's runtime deps aren't needed for lint.
      #
      # `ELECTRON_SKIP_BINARY_DOWNLOAD=1` skips the ~100 MB Electron
      # binary postinstall — ESLint never runs Electron, so the
      # download is wasted time. See tests.yml for the longer note.
      - name: Install root devDependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run ESLint
        run: npm run lint
