name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  scan:
    name: Scan
    # Skip on Dependabot PRs: GitHub withholds Actions secrets from
    # dependabot[bot]-triggered runs, so SONAR_TOKEN comes through
    # empty and the scanner errors with "Project not found". Dependabot
    # PRs only touch dependency manifests, so we lose no useful signal
    # by skipping. To restore coverage, copy SONAR_TOKEN into
    # Settings → Secrets and variables → Dependabot and drop this guard.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Shallow clones disable blame info, which Sonar uses to
          # attribute issues to authors and to compute the "new code"
          # baseline. Full history is cheap on this repo.
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Block until the quality gate is computed and fail the job
          # if it doesn't pass. Branch protection can then require this
          # check, the same way it requires CodeQL.
          args: >
            -Dsonar.qualitygate.wait=true
