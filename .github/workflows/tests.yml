name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Match Electron 42's bundled Node (22.x). Pinning major
          # so we don't pick up surprise behaviour in `node:test`.
          node-version: '22'
          cache: 'npm'

      # `npm ci` is faster + deterministic vs `npm install`. The
      # devDependency we need (jsdom) is in the root package.json;
      # the src/ workspace's deps aren't needed for the unit tests.
      #
      # `ELECTRON_SKIP_BINARY_DOWNLOAD=1` skips the ~100 MB Electron
      # binary that the `electron` npm package fetches in its
      # postinstall. None of the unit tests launch Electron — they
      # stub `electron` via `tests/helpers/mockElectron.js` — so the
      # download is pure waste in this job. `setup-node`'s npm cache
      # only covers the tarball cache, not postinstall side effects,
      # so this env var is the only knob that actually saves the time.
      - name: Install root devDependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run unit tests
        run: npm test
