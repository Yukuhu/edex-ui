sonar.projectKey=Yukuhu_edex-ui
sonar.organization=yukuhu

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Vendored / binary / generated assets — nothing for Sonar to learn
# from, and they otherwise dominate the line count.
sonar.exclusions=src/assets/vendor/**,src/assets/fonts/**,src/assets/audio/**,src/assets/icons/**,src/assets/misc/**,src/assets/themes/**,src/assets/kb_layouts/**,**/*.min.js,**/*.woff,**/*.woff2,**/*.ttf,**/*.otf
