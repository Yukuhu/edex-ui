sonar.projectKey=Yukuhu_edex-ui
sonar.organization=yukuhu

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage report produced by `npm run test:coverage` — the
# sonarcloud.yml workflow runs it before invoking the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Vendored / binary / generated assets — nothing for Sonar to learn
# from, and they otherwise dominate the line count.
sonar.exclusions=src/assets/vendor/**,src/assets/fonts/**,src/assets/audio/**,src/assets/icons/**,src/assets/misc/**,src/assets/themes/**,src/assets/kb_layouts/**,**/*.min.js,**/*.woff,**/*.woff2,**/*.ttf,**/*.otf

# Rule suppressions. SonarCloud's multi-criteria ignore syntax:
#   https://docs.sonarsource.com/sonarqube-cloud/enriching/managing-rules/#ignore-issues-on-multiple-criteria
sonar.issue.ignore.multicriteria=e1

# javascript:S7764 — "Use globalThis instead of window/self/global".
# The rule exists to make code portable across browser / Node / WebWorker
# environments. nDEX-UI is an Electron renderer; its entire surface
# (window.term[N], window.keyboard, window.settings, window.theme, etc.)
# is intentionally hung off `window` because that *is* the global there.
# The code will never run in Node or a WebWorker, so the rule's premise
# does not apply and clearing its ~250 occurrences would be churn for
# zero benefit. See issue #67.
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
